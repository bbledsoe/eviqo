name: Eviqo Handshake CI

on:
  push:
    branches:
      - fix-eviqo-web-handshake
  pull_request:
    paths:
      - 'packages/eviqo-client-api/**'
      - 'packages/eviqo-mqtt/**'
      - '.github/workflows/eviqo-handshake-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

# Home Assistant Add-on Configuration
name: Eviqo MQTT Dev
version: "1.2.1-handshake.2"
slug: eviqo-mqtt-dev
description: >-
  Development build for testing the current Eviqo web startup handshake.
  Based on the upstream Eviqo MQTT add-on with protocol-only changes.
url: https://github.com/bbledsoe/eviqo/tree/handshake-test
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: application
boot: manual
services:
  - mqtt:need
options:
  eviqo_email: ""
  eviqo_password: ""
  mqtt_url: "mqtt://auto_username:auto_password@auto_hostname"
  debug: false
schema:
  eviqo_email: email
  eviqo_password: password
  mqtt_url: str?
  debug: bool?
init: false
